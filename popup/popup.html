<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekRTL</title>
  <link rel="stylesheet" href="../css/geek.css">
  <style>
    /* ── Popup shell ─────────────────────────────────────────────── */
    html, body {
      width: 320px;
      min-height: 0;
      margin: 0;
      background: var(--gm-bg);
    }

    body {
      padding: var(--gm-space-4);
      display: flex;
      flex-direction: column;
      gap: var(--gm-space-4);
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .popup-header {
      display: flex;
      align-items: center;
      gap: var(--gm-space-3);
    }

    .popup-mark {
      --gm-mark-size: 40px;
      flex: none;
    }

    .popup-mark img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .popup-title-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* wordmark SVG inline — light/dark via CSS display trick */
    .popup-wordmark-light { display: block; }
    .popup-wordmark-dark  { display: none; }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) .popup-wordmark-light { display: none; }
      html:not([data-theme="light"]) .popup-wordmark-dark  { display: block; }
    }
    html[data-theme="dark"] .popup-wordmark-light { display: none; }
    html[data-theme="dark"] .popup-wordmark-dark  { display: block; }

    .popup-wordmark img {
      height: 22px;
      width: auto;
      display: block;
    }

    .popup-version {
      font-family: var(--gm-font-mono);
      font-size: 11px;
      color: var(--gm-muted);
      direction: ltr;
    }

    /* ── Divider ─────────────────────────────────────────────────── */
    .popup-divider {
      height: 1px;
      background: var(--gm-line);
      margin: 0 calc(-1 * var(--gm-space-4));
    }

    /* ── Toggle row ──────────────────────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--gm-space-3);
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .toggle-label-main {
      font-size: var(--gm-size-sm);
      font-weight: 600;
      color: var(--gm-text);
    }

    .toggle-label-sub {
      font-size: 12px;
      color: var(--gm-muted);
      line-height: 1.5;
    }

    /* Toggle switch */
    .toggle-switch {
      position: relative;
      flex: none;
      width: 44px;
      height: 26px;
    }

    .toggle-switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      display: block;
      width: 44px;
      height: 26px;
      border-radius: var(--gm-radius-pill);
      background: var(--gm-line);
      cursor: pointer;
      transition: background var(--gm-time-hover) var(--gm-ease);
      position: relative;
    }

    .toggle-track::after {
      content: "";
      position: absolute;
      top: 3px;
      inset-inline-start: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gm-surface);
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
      transition: inset-inline-start var(--gm-time-hover) var(--gm-ease),
                  background var(--gm-time-hover) var(--gm-ease);
    }

    input:checked + .toggle-track {
      background: var(--gm-accent);
    }

    input:checked + .toggle-track::after {
      inset-inline-start: calc(44px - 23px);
    }

    input:focus-visible + .toggle-track {
      outline: 2px solid var(--gm-accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .toggle-track, .toggle-track::after { transition: none; }
    }

    /* ── Status line ─────────────────────────────────────────────── */
    .popup-status {
      display: flex;
      align-items: center;
      gap: var(--gm-space-2);
      padding: var(--gm-space-2) var(--gm-space-3);
      border-radius: var(--gm-radius-md);
      background: var(--gm-chip);
      font-size: 13px;
      color: var(--gm-muted);
    }

    .popup-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gm-line);
      flex: none;
      transition: background var(--gm-time-hover) var(--gm-ease);
    }

    .popup-status-dot.active {
      background: var(--gm-signal);
    }

    .popup-status-text {
      flex: 1;
    }

    /* ── Theme switch ─────────────────────────────────────────────── */
    .theme-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--gm-space-3);
    }

    .theme-label {
      font-size: 13px;
      color: var(--gm-muted);
    }

    /* ── Footer / endorsement ─────────────────────────────────────── */
    .popup-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block-start: var(--gm-space-1);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="popup-header">
    <div class="gm-mark popup-mark">
      <img src="../icons/geekrtl-icon.svg" alt="" width="40" height="40">
    </div>
    <div class="popup-title-block">
      <div class="popup-wordmark">
        <span class="popup-wordmark-light">
          <img src="../icons/geekrtl-wordmark-light.svg" alt="GeekRTL" width="120" height="27">
        </span>
        <span class="popup-wordmark-dark">
          <img src="../icons/geekrtl-wordmark-dark.svg" alt="GeekRTL" width="120" height="27">
        </span>
      </div>
      <span class="popup-version" id="version">v2.0.0</span>
    </div>
  </header>

  <div class="popup-divider"></div>

  <!-- Toggle -->
  <div class="toggle-row">
    <div class="toggle-label">
      <span class="toggle-label-main">تصحیح جهت متن</span>
      <span class="toggle-label-sub">روی همه‌ی سایت‌های پشتیبانی‌شده</span>
    </div>
    <label class="toggle-switch" aria-label="تصحیح جهت متن">
      <input type="checkbox" id="toggleInput">
      <span class="toggle-track"></span>
    </label>
  </div>

  <!-- Status -->
  <div class="popup-status" id="statusBar" aria-live="polite">
    <span class="popup-status-dot" id="statusDot"></span>
    <span class="popup-status-text" id="statusText">در حال بررسی صفحه…</span>
  </div>

  <div class="popup-divider"></div>

  <!-- Theme switch -->
  <div class="theme-row">
    <span class="theme-label">پوسته</span>
    <div class="gm-seg" id="themeSeg" role="group" aria-label="انتخاب پوسته">
      <button type="button" data-theme="" aria-pressed="true">سیستم</button>
      <button type="button" data-theme="light" aria-pressed="false">روشن</button>
      <button type="button" data-theme="dark" aria-pressed="false">تیره</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="popup-footer">
    <a class="gm-sign" href="https://github.com/mani-imani" target="_blank" rel="noopener">
      از گیک‌مانی<i class="gm-cursor"></i>
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
